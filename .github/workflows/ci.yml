name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Check the Backend
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: backend
      - name: Run tests
        run: npm test
        working-directory: backend

  # Job 2: Check the Frontend
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/badminton-ai/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: frontend/badminton-ai
      - name: Run Linting
        run: npm run lint
        working-directory: frontend/badminton-ai
      - name: Run build (includes type-checking via tsc -b)
        run: npm run build
        working-directory: frontend/badminton-ai

  # Job 3: Check the Worker
  worker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: worker
      - name: Run tests
        run: pytest tests/
        working-directory: worker
